# Startet das komplette Spiel. Erwartet das Frontend-Repo direkt daneben:
#   ./untextured-kingdoms-backend   (dieses Repo)
#   ./untextured-kingdoms-frontend
#
# Nach außen geht nur der Dienst "web", und auch der nur auf 127.0.0.1 (Standard Port 8081).
# HTTPS macht der Webserver davor (bei uns Apache, siehe deploy/apache-vhost.conf).
services:
  server:
    build: .
    restart: unless-stopped
    # Beim Stoppen speichert der Server alle laufenden Spiele, dafür etwas Zeit lassen.
    stop_grace_period: 30s
    environment:
      RUST_LOG: info
      # Admin-Rechte hängen an Accounts. Diese Namen (Komma-getrennt) werden beim Start zu Admins.
      ADMIN_USERS: ${ADMIN_USERS:-}
      # Accounts: eigene DATABASE_URL oder der Dienst "db" unten.
      DATABASE_URL: ${DATABASE_URL:-postgres://uk:${DB_PASSWORD:?DB_PASSWORD in .env setzen}@db:5432/untextured_kingdoms}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - game_data:/data

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: uk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen}
      POSTGRES_DB: untextured_kingdoms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uk -d untextured_kingdoms"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      # Nur lokal: zum Ansehen mit DBeaver o. Ä. über einen SSH-Tunnel (siehe deploy/ANLEITUNG.md).
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: ../untextured-kingdoms-frontend
    restart: unless-stopped
    depends_on:
      - server
    ports:
      # Nur lokal erreichbar; Apache leitet https://<domain>/ hierher weiter.
      - "127.0.0.1:${WEB_PORT:-8081}:80"

  # Datenbank im Browser ansehen (wie phpMyAdmin). Nur auf 127.0.0.1, Zugriff per SSH-Tunnel,
  # NICHT über Apache veröffentlichen (siehe deploy/ANLEITUNG.md).
  adminer:
    image: adminer:latest
    restart: unless-stopped
    # Nur IPv4 im Container (der Standard [::] scheitert, wenn Docker kein IPv6 hat).
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www/html"]
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8082}:8080"

volumes:
  game_data:
  db_data:

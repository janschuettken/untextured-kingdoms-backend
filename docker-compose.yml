# Startet das komplette Spiel. Erwartet das Frontend-Repo direkt daneben:
#   ./untextured-kingdoms-backend   (dieses Repo)
#   ./untextured-kingdoms-frontend
services:
  server:
    build: .
    restart: unless-stopped
    environment:
      RUST_LOG: info
      # Admin-Menü und Balancing-Editor: Token in .env setzen, leer = aus.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Accounts: eigene DATABASE_URL oder der Dienst "db" unten.
      DATABASE_URL: ${DATABASE_URL:-postgres://uk:${DB_PASSWORD:-uk}@db:5432/untextured_kingdoms}
    depends_on:
      - db
    volumes:
      - game_data:/data

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: uk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uk}
      POSTGRES_DB: untextured_kingdoms
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: ../untextured-kingdoms-frontend
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  game_data:
  db_data:
  caddy_data:
  caddy_config:

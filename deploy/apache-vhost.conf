# Apache-vHost für Untextured Kingdoms hinter HTTPS.
# Datei: /etc/apache2/sites-enabled/untexturedkingdoms.jan-schuettken.de.conf
#
# Nötige Module (einmalig):  sudo a2enmod proxy proxy_http proxy_wstunnel headers
# Danach prüfen und neu laden:  sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Alles (Seiten, /api, und die WebSockets /lobby und /ws) geht an den Container "web"
# auf 127.0.0.1:8081. Der liefert den Client aus und reicht /api, /lobby und /ws an den
# Rust-Server weiter. Der Client baut seine WebSocket-Adresse aus der Seitenadresse
# (https -> wss, gleicher Host), dafür ist hier nichts weiter einzustellen.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName untexturedkingdoms.jan-schuettken.de

    # Das Spiel liegt im Container, das DocumentRoot wird nicht mehr gebraucht.
    # (Darf stehen bleiben, schadet nicht.)
    # DocumentRoot /var/www/subdomains/untexturedkingdoms

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"

    # upgrade=websocket: Apache (ab 2.4.47) reicht WebSocket-Verbindungen durch.
    # timeout: lange offene Verbindungen nicht nach 60 s abbrechen.
    ProxyPass        / http://127.0.0.1:8081/ upgrade=websocket timeout=3600
    ProxyPassReverse / http://127.0.0.1:8081/

    ErrorLog  ${APACHE_LOG_DIR}/untexturedkingdoms-error.log
    CustomLog ${APACHE_LOG_DIR}/untexturedkingdoms-access.log combined

    # Diese Zeilen hat certbot angelegt, so lassen wie sie sind:
    SSLCertificateFile /etc/letsencrypt/live/untexturedkingdoms.jan-schuettken.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/untexturedkingdoms.jan-schuettken.de/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
